[project]
name = "research-assistant"
version = "0.1.0"
description = "Multi-agent academic research assistant: RAG pipeline with a fact-check critic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core>=1.0.0",
    "agent-framework-openai>=1.0.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
