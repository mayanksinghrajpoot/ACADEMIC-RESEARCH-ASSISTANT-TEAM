<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460" role="img" aria-labelledby="title desc">
  <title id="title">Research assistant workflow</title>
  <desc id="desc">Six agents share one dossier. Retrieval reads the passage index. Fact-check can send the summary back once.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1c2430; }
    .box { fill: #f7f4ee; stroke: #1c2430; stroke-width: 1.5; }
    .memory { fill: #e7efe8; stroke: #1c2430; stroke-width: 1.5; }
    .index { fill: #e8eef6; stroke: #1c2430; stroke-width: 1.5; }
    .name { font-size: 15px; font-weight: 700; }
    .tool { font-size: 11px; fill: #3d4a5c; }
    .label { font-size: 13px; font-weight: 700; }
    .small { font-size: 12px; fill: #3d4a5c; }
    .arrow { stroke: #1c2430; stroke-width: 1.5; fill: none; }
    .retry { stroke: #9a4d12; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>
  <rect width="1180" height="460" fill="#fbfbf9"/>
  <text x="36" y="34" class="label" style="font-size:18px">Academic research assistant  Agent Framework workflow</text>

  <rect class="box" x="36" y="58" width="168" height="112" rx="8"/>
  <text class="name" x="52" y="84">Query</text>
  <text class="tool" x="52" y="108">list_corpus_titles</text>
  <text class="tool" x="52" y="128">commit_subqueries</text>
  <text class="small" x="52" y="152">writes sub-queries</text>

  <rect class="box" x="250" y="58" width="176" height="112" rx="8"/>
  <text class="name" x="266" y="84">Retrieval</text>
  <text class="tool" x="266" y="108">embed_subqueries</text>
  <text class="tool" x="266" y="128">store_retrieved_passages</text>
  <text class="small" x="266" y="152">writes passages</text>

  <rect class="box" x="492" y="58" width="210" height="112" rx="8"/>
  <text class="name" x="508" y="84">Summary</text>
  <text class="tool" x="508" y="108">read_passages_for_summary</text>
  <text class="tool" x="508" y="128">commit_claims</text>
  <text class="small" x="508" y="152">writes claims</text>

  <rect class="box" x="492" y="186" width="210" height="112" rx="8"/>
  <text class="name" x="508" y="212">Contradiction</text>
  <text class="tool" x="508" y="236">read_passages_for_contradictions</text>
  <text class="tool" x="508" y="256">commit_contradictions</text>
  <text class="small" x="508" y="280">writes disagreements</text>

  <rect class="box" x="768" y="58" width="176" height="112" rx="8"/>
  <text class="name" x="784" y="84">Fact-check</text>
  <text class="tool" x="784" y="108">select_checkable_claims</text>
  <text class="tool" x="784" y="128">commit_verdicts</text>
  <text class="small" x="784" y="152">writes verdicts</text>

  <rect class="box" x="990" y="58" width="154" height="112" rx="8"/>
  <text class="name" x="1006" y="84">Writer</text>
  <text class="tool" x="1006" y="108">draft_supported_overview</text>
  <text class="tool" x="1006" y="128">publish_report</text>
  <text class="small" x="1006" y="152">writes the report</text>

  <path class="arrow" d="M204 114 H250" marker-end="url(#head)"/>
  <path class="arrow" d="M426 100 H492" marker-end="url(#head)"/>
  <path class="arrow" d="M426 128 V242 H492" marker-end="url(#head)"/>
  <path class="arrow" d="M702 114 H768" marker-end="url(#head)"/>
  <path class="arrow" d="M702 242 H735 V114 H768" marker-end="url(#head)"/>
  <path class="arrow" d="M944 114 H990" marker-end="url(#head)"/>
  <path class="retry" d="M856 58 V36 H597 V58" marker-end="url(#retryhead)"/>
  <text class="small" x="640" y="30" fill="#9a4d12">one retry</text>
  <text class="small" x="430" y="168">together</text>

  <rect class="index" x="250" y="330" width="176" height="86" rx="8"/>
  <text class="label" x="266" y="358">Passage index</text>
  <text class="small" x="266" y="380">paper chunks</text>
  <text class="small" x="266" y="398">optional embeddings</text>
  <path class="arrow" d="M338 330 V170" marker-end="url(#head)"/>

  <rect class="memory" x="492" y="330" width="652" height="86" rx="8"/>
  <text class="label" x="508" y="358">ResearchDossier  one shared object</text>
  <text class="small" x="508" y="382">question, sub-queries, passages, claims, contradictions,</text>
  <text class="small" x="508" y="400">verdicts, dropped claims, report. Every agent reads and writes it.</text>

  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#1c2430"/>
    </marker>
    <marker id="retryhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9a4d12"/>
    </marker>
  </defs>
</svg>
